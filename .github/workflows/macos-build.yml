name: macOS Build

on:
  push:
    branches:
      - main
      - feature/macos-movist-custom-player
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build project
        run: npm run build
      
      - name: Get version from package.json
        id: package_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"
      
      - name: Create archive
        run: |
          cd build
          zip -r ../lampa-macos-v${{ steps.package_version.outputs.version }}.zip .
          cd ..
      
      - name: Calculate checksums
        run: |
          shasum -a 256 lampa-macos-v${{ steps.package_version.outputs.version }}.zip > checksums.txt
          cat checksums.txt
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lampa-macos-build
          path: |
            lampa-macos-v${{ steps.package_version.outputs.version }}.zip
            checksums.txt
          retention-days: 30
      
      - name: Create Release
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            lampa-macos-v${{ steps.package_version.outputs.version }}.zip
            checksums.txt
          body: |
            ## 🎉 Lampa macOS Build v${{ steps.package_version.outputs.version }}
            
            ### ✨ New Features
            - ✅ Movist Pro player support
            - ✅ Custom Player with URL scheme
            - ✅ Enhanced macOS player integration
            
            ### 📦 Installation
            1. Download `lampa-macos-v${{ steps.package_version.outputs.version }}.zip`
            2. Extract the archive
            3. Open `index.html` in your browser
            4. Configure player in Settings → Player → Player type
            
            ### 🎮 Supported Players
            - IINA
            - Infuse
            - MPV
            - nPlayer
            - Movist Pro
            - Custom Player (any URL scheme)
            - TracyPlayer
            
            ### 📝 Checksums
            See `checksums.txt` for SHA-256 verification
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}